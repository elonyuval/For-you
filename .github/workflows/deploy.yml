name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Only does anything when Settings → Pages → Source is "GitHub Actions".
# If Pages is instead serving the branch directly, this run fails at the
# deploy step and the committed build at the repo root is what is served.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # The build writes to the repo root, which here also holds node_modules
      # and the sources — collect just the site into its own directory.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/
          # DATE RUN is static and does not go through the build — it just
          # rides along, so /date-run/ works in this mode too.
          cp -r date-run _site/
          touch _site/.nojekyll

      # No `enablement: true` here: the workflow token is not allowed to
      # create the Pages site, and asking it to is a hard failure.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
